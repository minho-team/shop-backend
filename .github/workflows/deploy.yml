name: Deploy Spring Boot WAR to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build WAR
        run: mvn clean package -DskipTests

      - name: Copy WAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "target/shop-0.0.1-SNAPSHOT.war"
          target: "/home/ubuntu/"

      - name: Replace WAR and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            mv /home/ubuntu/target/shop-0.0.1-SNAPSHOT.war /home/ubuntu/shop-0.0.1-SNAPSHOT.war
            sudo systemctl restart shop
            sudo systemctl status shop --no-pager
            ls -l /home/ubuntu/shop-0.0.1-SNAPSHOT.war
